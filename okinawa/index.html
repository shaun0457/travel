<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>沖繩自駕漫遊 2026</title>
<meta name="theme-color" content="#f0f9ff">
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f0f9ff;color:#334155}
#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.card{background:#fff;border:1px solid #bae6fd;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(14,165,233,.10)}
.icon{font-size:32px;margin-bottom:10px}.detail{font-size:13px;color:#64748b;margin-top:8px}
</style>
</head>
<body>
<div id="status"><div class="card"><div class="icon">🌺</div><strong>正在載入沖繩行程…</strong><div id="detail" class="detail">請稍候</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
(async()=>{
 try{
  const files=['assets/data1.txt','assets/data2.txt','assets/data3.txt'];
  const parts=await Promise.all(files.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`${p}: ${r.status}`);return r.text();}));
  const b64=parts.join('').replace(/\s+/g,'');
  const binary=atob(b64);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const html=pako.ungzip(bytes,{to:'string'});
  document.open();document.write(html);document.close();
 }catch(err){
  console.error(err);
  document.getElementById('detail').textContent='載入失敗：'+err.message;
 }
})();
</script>
</body>
</html>
