      <div class="bg-white rounded-2xl p-4 card-shadow border border-sky-100 space-y-3">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs"><i class="fa-solid fa-calculator"></i></div>
            <h3 class="font-bold text-slate-800 text-sm">日幣 ➔ 台幣換算機</h3>
          </div>
          <div class="flex items-center gap-1 text-[11px] font-mono text-slate-500">
            <label for="custom-rate">匯率:</label>
            <input type="number" id="custom-rate" value="0.215" step="0.001" inputmode="decimal" oninput="updateRate()" class="w-16 px-1.5 py-0.5 bg-slate-100 rounded text-center font-bold text-slate-700">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label for="calc-jpy" class="text-[10px] font-bold text-slate-400 block mb-1">日圓 (JPY ¥)</label>
            <input type="number" id="calc-jpy" value="1000" inputmode="numeric" oninput="convertCurrency('jpy')" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold font-outfit text-slate-800 focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label for="calc-twd" class="text-[10px] font-bold text-slate-400 block mb-1">新台幣 (TWD NT$)</label>
            <input type="number" id="calc-twd" value="215" inputmode="numeric" oninput="convertCurrency('twd')" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold font-outfit text-emerald-600 focus:outline-none focus:border-brand-500">
          </div>
        </div>
        <div class="flex gap-1.5 overflow-x-auto hide-scrollbar pt-1">
          <button onclick="setCalcValue(500)" class="px-2.5 py-1 rounded-lg bg-slate-100 text-[11px] font-semibold text-slate-600 shrink-0">¥500 (御朱印)</button>
          <button onclick="setCalcValue(1000)" class="px-2.5 py-1 rounded-lg bg-slate-100 text-[11px] font-semibold text-slate-600 shrink-0">¥1,000</button>
          <button onclick="setCalcValue(3000)" class="px-2.5 py-1 rounded-lg bg-slate-100 text-[11px] font-semibold text-slate-600 shrink-0">¥3,000</button>
          <button onclick="setCalcValue(5500)" class="px-2.5 py-1 rounded-lg bg-slate-100 text-[11px] font-semibold text-slate-600 shrink-0">¥5,500 (免稅)</button>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 card-shadow border border-sky-100 space-y-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center text-xs"><i class="fa-solid fa-list-check"></i></div>
          <h3 class="font-bold text-slate-800 text-sm">自駕隨身與行李清單</h3>
        </div>
        <div id="packing-checklist" class="space-y-2"></div>
      </div>

      <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-xl space-y-2.5">
        <div class="flex items-center gap-2 text-rose-400">
          <i class="fa-solid fa-phone-volume text-sm"></i>
          <h4 class="font-bold text-xs tracking-wide uppercase">沖繩緊急求助通訊錄</h4>
        </div>
        <div class="grid grid-cols-2 gap-2 text-[11px]">
          <a href="tel:110" class="bg-white/10 rounded-xl p-2 block"><div class="text-slate-400">報警 (Police)</div><div class="font-bold text-sm font-outfit text-white">110</div></a>
          <a href="tel:119" class="bg-white/10 rounded-xl p-2 block"><div class="text-slate-400">救護車 / 火警</div><div class="font-bold text-sm font-outfit text-white">119</div></a>
        </div>
        <div class="bg-white/10 rounded-xl p-2.5 text-[11px] space-y-1">
          <div class="text-slate-400">台北駐日經濟文化代表處 那霸分處</div>
          <a href="tel:0988627008" class="font-bold text-white text-xs block">098-862-7008</a>
          <a href="tel:09019422007" class="text-amber-300 text-[10px] block">緊急求助專線：090-1942-2007</a>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部導航 -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-1 pt-1.5 nav-safe">

      <button onclick="switchMainTab('itinerary')" id="nav-btn-itinerary" class="nav-btn flex flex-col items-center py-1 text-brand-600 transition-colors">
        <i class="fa-solid fa-calendar-day text-sm"></i><span id="nav-label-itinerary" class="text-[9px] font-bold mt-1">行程表</span>

      <button onclick="switchMainTab('shrine')" id="nav-btn-shrine" class="nav-btn flex flex-col items-center py-1 text-slate-400 transition-colors">
        <i class="fa-solid fa-torii-gate text-sm"></i><span id="nav-label-shrine" class="text-[9px] font-medium mt-1">主題攻略</span>
      </button>
      <button onclick="switchMainTab('backup')" id="nav-btn-backup" class="nav-btn flex flex-col items-center py-1 text-slate-400 transition-colors">
        <i class="fa-solid fa-layer-group text-sm"></i><span id="nav-label-backup" class="text-[9px] font-medium mt-1">備選庫</span>
      </button>
      <button onclick="switchMainTab('tasks')" id="nav-btn-tasks" class="nav-btn flex flex-col items-center py-1 text-slate-400 relative transition-colors">
        <i class="fa-solid fa-clock text-sm"></i><span id="nav-label-tasks" class="text-[9px] font-medium mt-1">待處理</span>
        <span id="tasks-badge" class="absolute top-0 right-3 w-2 h-2 rounded-full bg-rose-500"></span>
      </button>
      <button onclick="switchMainTab('tools')" id="nav-btn-tools" class="nav-btn flex flex-col items-center py-1 text-slate-400 transition-colors">
        <i class="fa-solid fa-store text-sm"></i><span id="nav-label-tools" class="text-[9px] font-medium mt-1">工具</span>
