name: Build and Deploy Travel Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source
        run: npm run verify
      - name: Build static site
        run: npm run build
      - name: Verify build
        run: npm run verify:build
      - name: Install Playwright mobile gate
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify mobile runtime at 390x844
        run: |
          for page in dist/*/index.html; do
            echo "Verifying $page"
            npm run verify:mobile -- "$page"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
