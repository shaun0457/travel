name: Deploy Travel Sync Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: services/travel-sync
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(npx --yes wrangler@latest d1 list --json | jq -r '.[] | select(.name=="travel-state") | (.uuid // .id)' | head -n1)"
          if [ -z "$DB_ID" ]; then
            OUT="$(npx --yes wrangler@latest d1 create travel-state --location=apac)"
            printf '%s\n' "$OUT"
            DB_ID="$(printf '%s\n' "$OUT" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n1)"
          fi
          test -n "$DB_ID" || (echo "Could not resolve D1 database id" && exit 1)
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/g" wrangler.jsonc
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 schema
        run: npx --yes wrangler@latest d1 execute travel-state --remote --file=schema.sql --yes

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy
